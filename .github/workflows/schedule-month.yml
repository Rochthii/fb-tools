name: Schedule Month

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Xoa lich cu va tao moi (yes/no)'
        required: false
        default: 'no'

jobs:
  schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Composio CLI
        env:
          COMPOSIO_INSTALL_PLUGINS: "0"
        run: |
          curl -fsSL https://raw.githubusercontent.com/ComposioHQ/composio/next/install.sh | bash
          echo "$HOME/.composio" >> $GITHUB_PATH

      - name: Schedule 30 Days
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: bash scripts/schedule-month.sh
