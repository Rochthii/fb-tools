name: FB Auto Post

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Composio CLI
        env:
          COMPOSIO_INSTALL_PLUGINS: "0"
        run: |
          curl -fsSL https://raw.githubusercontent.com/ComposioHQ/composio/next/install.sh | bash
          echo "$HOME/.composio" >> $GITHUB_PATH

      - name: Auto Post
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          echo "HOME=$HOME"
          echo "PATH=$PATH"
          command -v composio && echo "composio found at $(which composio)" || echo "composio NOT in PATH"
          echo "--- scripts/ ---"
          ls -la scripts/
          echo "--- run auto-post.sh ---"
          bash -x scripts/auto-post.sh 2>&1
