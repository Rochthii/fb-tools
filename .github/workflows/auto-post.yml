name: FB Auto Post

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install & Auth & Post
        run: |
          set -e
          curl -fsSL https://raw.githubusercontent.com/ComposioHQ/composio/next/install.sh | bash
          export PATH="$HOME/.composio/bin:$PATH"
          composio login --api-key "${{ secrets.COMPOSIO_API_KEY }}"
          composio whoami
          bash scripts/auto-post.sh
