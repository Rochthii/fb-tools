name: FB Auto Post

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Composio CLI
        run: pip install composio-core

      - name: Debug
        run: |
          echo "PATH=$PATH"
          which composio || echo "composio not in PATH"
          python3 --version
          bash --version

      - name: Authenticate Composio
        run: composio login --api-key "${{ secrets.COMPOSIO_API_KEY }}"

      - name: Auto Post
        run: bash scripts/auto-post.sh
